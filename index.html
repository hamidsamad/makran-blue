<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Makran Blue — a coastal knowledge platform for the Makran coast of Balochistan."
    />
    <title>Makran Blue</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600&family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("mb-theme");
          var lang = localStorage.getItem("mb-lang") || "en";
          document.documentElement.setAttribute(
            "data-theme",
            theme === "light" ? "light" : "dark"
          );
          var rtl = lang === "ur" || lang === "bal";
          document.documentElement.lang = lang;
          document.documentElement.dir = rtl ? "rtl" : "ltr";
          document.documentElement.classList.toggle("rtl", rtl);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
